{% extends "base.html" %}

{% block title %}Montar minha dieta — FitPlan{% endblock %}

{% block content %}
<section class="form-page">
  <div class="container">
    <div class="form-card">
      <h1>🥗 Montar minha dieta</h1>
      <p class="intro">Preencha os dados abaixo para gerar sua sugestão de cardápio semanal.</p>

      <form action="{{ url_for('resultado_dieta') }}" method="POST">

        <div class="form-group">
          <label for="peso">Seu peso atual (kg)</label>
          <input
            type="text"
            inputmode="decimal"
            class="form-control"
            id="peso"
            name="peso"
            placeholder="Ex.: 72.5"
            required
          >
          <span class="hint">Use ponto ou vírgula para casas decimais.</span>
        </div>

        <div class="form-group">
          <label>Qual é o seu objetivo?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="objetivo" value="emagrecimento" required>
              <span class="option-text">
                <strong>Emagrecimento</strong>
                <span>Déficit calórico para redução de peso.</span>
              </span>
            </label>
            <label class="radio-option">
              <input type="radio" name="objetivo" value="manutencao" checked>
              <span class="option-text">
                <strong>Manutenção de peso</strong>
                <span>Equilíbrio calórico para manter o peso atual.</span>
              </span>
            </label>
            <label class="radio-option">
              <input type="radio" name="objetivo" value="ganho_de_massa">
              <span class="option-text">
                <strong>Ganho de massa</strong>
                <span>Superávit calórico para ganho de peso/massa muscular.</span>
              </span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="dias_semana">Quantos dias da semana deseja seguir a dieta?</label>
          <select class="form-control" id="dias_semana" name="dias_semana" required>
            <option value="7" selected>7 dias (todos os dias)</option>
            <option value="6">6 dias</option>
            <option value="5">5 dias</option>
            <option value="4">4 dias</option>
            <option value="3">3 dias</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Gerar minha dieta</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
