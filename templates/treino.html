{% extends "base.html" %}

{% block title %}Montar meu treino — FitPlan{% endblock %}

{% block content %}
<section class="form-page">
  <div class="container">
    <div class="form-card">
      <h1>🏋️ Montar meu treino</h1>
      <p class="intro">Escolha seu objetivo e receba uma rotina de treino para 5 dias da semana.</p>

      <form action="{{ url_for('resultado_treino') }}" method="POST">

        <div class="form-group">
          <label>Qual é o seu objetivo?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="objetivo" value="ganho_de_massa" required>
              <span class="option-text">
                <strong>Ganho de massa muscular</strong>
                <span>Séries e repetições focadas em hipertrofia.</span>
              </span>
            </label>
            <label class="radio-option">
              <input type="radio" name="objetivo" value="emagrecimento">
              <span class="option-text">
                <strong>Emagrecimento</strong>
                <span>Mais repetições e menos descanso, foco metabólico.</span>
              </span>
            </label>
            <label class="radio-option">
              <input type="radio" name="objetivo" value="condicionamento">
              <span class="option-text">
                <strong>Condicionamento físico</strong>
                <span>Treinos dinâmicos com repetições altas.</span>
              </span>
            </label>
            <label class="radio-option">
              <input type="radio" name="objetivo" value="manutencao" checked>
              <span class="option-text">
                <strong>Manutenção</strong>
                <span>Parâmetros equilibrados para manter a forma física.</span>
              </span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-secondary btn-block">Gerar meu treino</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
